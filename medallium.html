<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki</title>
    <link rel="stylesheet" href="Content/CSS/Main.css">
    <script defer src="Content/JS/main.js"></script>
    <script defer src='Content/JS/Databases/YoKaiDataBase.js'></script>
	<script defer src='Content/JS/Databases/AttackDatabase.js'></script>
	<script defer src='Content/JS/Databases/TechniqueDatabase.js'></script>
	<script defer src='Content/JS/Databases/InspiritDatabase.js'></script>
	<script defer src='Content/JS/Databases/SteffInfoDatabase.js'></script>
    <script defer src='Content/JS/medallium-script.js'></script>
	<style>
	.attribute-button{
		cursor: pointer; 
		background: none; 
		border: none; 
		width: 100px; 
		height: 100px;
	}
	details{
		padding: 10px;
		text-align: center;
		color: var(--side-buttons-color);
		cursor: pointer;
		font-size: 16px;
	}
	</style>
</head>
<body>
    <nav id="nav-tab">
    </nav>
    <div class="wrapper;">
		<aside class="side-bar" id="side_bar"></aside>
		<main style="display: flex; align-items: flex-start; justify-content: center;">
				<div class="yokai-list transparent-background" style="list-style: none; overflow-y: visible; height: auto;">
				<details>
					<summary>Attribute List</summary>
					<ul>
						<li>
							<div class="yokai-attributes" data-type="Tribes">
								<button id="Brave" class="attribute-button"><img src="Content/Graphics/Tribes/Brave.png" style="width: auto; height:80px;" alt="Brave Tribe"></button>
								<button id="Mysterious" class="attribute-button"><img src="Content/Graphics/Tribes/Mysterious.png" style="width: auto; height:80px;" alt="Mysterious Tribe"></button>
								<button id="Tough" class="attribute-button"><img src="Content/Graphics/Tribes/Tough.png" style="width: auto; height:70px;" alt="Tough Tribe"></button>
								<button id="Charming" class="attribute-button"><img src="Content/Graphics/Tribes/Charming.png" style="width: auto; height:80px;" alt="Charming Tribe"></button>
								<button id="Heartful" class="attribute-button"><img src="Content/Graphics/Tribes/Heartful.png" style="width: auto; height:80px;" alt="Heartful Tribe"></button>

								<button id="Eerie" class="attribute-button"><img src="Content/Graphics/Tribes/Eerie.png" style="width: 80px; height:55px;" alt="Eerie Tribe"></button>
								<button id="Slippery" class="attribute-button"><img src="Content/Graphics/Tribes/Slippery.png" style="width: auto; height:80px;" alt="Slippery Tribe"></button>
								<button id="Wicked" class="attribute-button"><img src="Content/Graphics/Tribes/Wicked.png" style="width: auto; height:80px;" alt="Wicked Tribe"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Ranks">
								<button id="rank_E" class="attribute-button"><img src="Content/Graphics/ranks/E.png" style="width: auto; height:70px;" alt="Rank E"></button>
								<button id="rank_D" class="attribute-button"><img src="Content/Graphics/ranks/D.png" style="width: auto; height:70px;" alt="Rank D"></button>
								<button id="rank_C" class="attribute-button"><img src="Content/Graphics/ranks/C.png" style="width: auto; height:70px;" alt="Rank C"></button>
								<button id="rank_B" class="attribute-button"><img src="Content/Graphics/ranks/B.png" style="width: auto; height:70px;" alt="Rank B"></button>
								<button id="rank_A" class="attribute-button"><img src="Content/Graphics/ranks/A.png" style="width: auto; height:70px;" alt="Rank A"></button>
								<button id="rank_S" class="attribute-button"><img src="Content/Graphics/ranks/S.png" style="width: auto; height:70px;" alt="Rank S"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Elements">
								<button id="Fire" class="attribute-button"><img src="Content/Graphics/Elements/Fire.png" style="width: auto; height:70px;" alt="Fire Element Icon"></button>
								<button id="Water" class="attribute-button"><img src="Content/Graphics/Elements/Water.png" style="width: auto; height:70px;" alt="Water Element Icon"></button>
								<button id="Lightning" class="attribute-button"><img src="Content/Graphics/Elements/Lightning.png" style="width: auto; height:70px;" alt="Lightning Element Icon"></button>
								<button id="Earth" class="attribute-button"><img src="Content/Graphics/Elements/Earth.png" style="width: auto; height:70px;" alt="Earth Element Icon"></button>
								<button id="Wind" class="attribute-button"><img src="Content/Graphics/Elements/Wind.png" style="width: auto; height:70px;" alt="Wind Element Icon"></button>

								<button id="Drain" class="attribute-button"><img src="Content/Graphics/Elements/Drain.png" style="width: auto; height:70px;" alt="Drain Element Icon"></button>
								<button id="Restoration" class="attribute-button"><img src="Content/Graphics/Elements/Restoration.png" style="width: auto; height:70px;" alt="Restoration Element Icon"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Inspirits" style="display: flex">
								<button id="STR_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/STR_Buff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="SPR_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPR_Buff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="SPD_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPD_Buff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="DEF_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/DEF_Buff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="ALL_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/ALL_Buff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Attract" class="attribute-button"><img src="Content/Graphics/InspiritImages/Attract.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Stealth" class="attribute-button"><img src="Content/Graphics/InspiritImages/Stealth.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Recover" class="attribute-button"><img src="Content/Graphics/InspiritImages/Recover.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Inspirits" style="display: flex">
								<button id="STR_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/STR_Debuff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="SPR_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPR_Debuff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="SPD_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPD_Debuff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="DEF_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/DEF_Debuff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="ALL_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/ALL_Debuff.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Stun" class="attribute-button"><img src="Content/Graphics/InspiritImages/Stun.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Confuse" class="attribute-button"><img src="Content/Graphics/InspiritImages/Confuse.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Throw" class="attribute-button"><img src="Content/Graphics/InspiritImages/Throw.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
								<button id="Poison" class="attribute-button"><img src="Content/Graphics/InspiritImages/Poison.png" style="width: auto; height:70px;" alt="InspiritIco"></button>
							</div>
						</li>
					</ul>
				</details>
				<input type="search" id="search-input" name="query" placeholder="Search for Yokai...">
					<div id="data-page" class="yokai-list"></div>
				</div>
		</main>
	</div>

</html>
