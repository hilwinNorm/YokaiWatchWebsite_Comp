<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki</title>
    <link rel="stylesheet" href="Content/CSS/main.css">
    <link rel="stylesheet" href="Content/CSS/medallium.css">
    <link rel="stylesheet" href="Content/CSS/info-list-style.css"/>
    <script defer src="Content/JS/main.js"></script>
    <script defer src='Content/JS/Databases/YokaiDatabase.js'></script>
    <script defer src='Content/JS/Databases/MoveDatabase.js'></script>
    <script defer src='Content/JS/Databases/skill_config_0.03p/SKILL_CONFIG_INFO.js'></script>
	<script defer src='Content/JS/Databases/SteffInfoDatabase.js'></script>
    <script defer src='Content/JS/medallium-script.js'></script>
	<style>
		main {
			display: flex; 
			align-items: flex-start; 
			justify-content: center;
		}
	</style>
</head>
<body>
    <nav id="nav-tab">
    </nav>
    <div class="wrapper;">
		<aside class="side-bar" id="side_bar"></aside>
		<main>
				<div class="yokai-list transparent-background">
				<details>
					<summary>Attribute List</summary>
					<ul>
						<li>
							<div class="yokai-attributes" data-type="Tribes">
								<button id="Brave" class="attribute-button"><img src="Content/Graphics/Tribes/Brave.png" alt="Brave Tribe"></button>
								<button id="Mysterious" class="attribute-button"><img src="Content/Graphics/Tribes/Mysterious.png" alt="Mysterious Tribe"></button>
								<button id="Tough" class="attribute-button"><img src="Content/Graphics/Tribes/Tough.png" alt="Tough Tribe"></button>
								<button id="Charming" class="attribute-button"><img src="Content/Graphics/Tribes/Charming.png" alt="Charming Tribe"></button>
								<button id="Heartful" class="attribute-button"><img src="Content/Graphics/Tribes/Heartful.png" alt="Heartful Tribe"></button>
								<button id="Shady" class="attribute-button"><img src="Content/Graphics/Tribes/Shady.png" alt="Shady Tribe"></button>
								<button id="Eerie" class="attribute-button"><img src="Content/Graphics/Tribes/Eerie.png" style="width: 80px; height:55px;" alt="Eerie Tribe"></button>
								<button id="Slippery" class="attribute-button"><img src="Content/Graphics/Tribes/Slippery.png" alt="Slippery Tribe"></button>
								<button id="Wicked" class="attribute-button"><img src="Content/Graphics/Tribes/Wicked.png" alt="Wicked Tribe"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Ranks">
								<button id="rank_E" class="attribute-button"><img src="Content/Graphics/ranks/E.png" alt="Rank E"></button>
								<button id="rank_D" class="attribute-button"><img src="Content/Graphics/ranks/D.png" alt="Rank D"></button>
								<button id="rank_C" class="attribute-button"><img src="Content/Graphics/ranks/C.png" alt="Rank C"></button>
								<button id="rank_B" class="attribute-button"><img src="Content/Graphics/ranks/B.png" alt="Rank B"></button>
								<button id="rank_A" class="attribute-button"><img src="Content/Graphics/ranks/A.png" alt="Rank A"></button>
								<button id="rank_S" class="attribute-button"><img src="Content/Graphics/ranks/S.png" alt="Rank S"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Elements">
								<button id="Fire" class="attribute-button"><img src="Content/Graphics/Elements/Fire.png" alt="Fire Element Icon"></button>
								<button id="Water" class="attribute-button"><img src="Content/Graphics/Elements/Water.png" alt="Water Element Icon"></button>
								<button id="Lightning" class="attribute-button"><img src="Content/Graphics/Elements/Lightning.png" alt="Lightning Element Icon"></button>
								<button id="Earth" class="attribute-button"><img src="Content/Graphics/Elements/Earth.png" alt="Earth Element Icon"></button>
								<button id="Wind" class="attribute-button"><img src="Content/Graphics/Elements/Wind.png" alt="Wind Element Icon"></button>
								<button id="Ice" class="attribute-button"><img src="Content/Graphics/Elements/Ice.png" alt="Ice Element Icon"></button>
								<button id="Drain" class="attribute-button"><img src="Content/Graphics/Elements/Drain.png" alt="Drain Element Icon"></button>
								<button id="Restoration" class="attribute-button"><img src="Content/Graphics/Elements/Restoration.png" alt="Restoration Element Icon"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Inspirits" style="display: flex">
								<button id="STR_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/STR_Buff.png" alt="InspiritIco"></button>
								<button id="SPR_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPR_Buff.png" alt="InspiritIco"></button>
								<button id="SPD_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPD_Buff.png" alt="InspiritIco"></button>
								<button id="DEF_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/DEF_Buff.png" alt="InspiritIco"></button>
								<button id="ALL_Buff" class="attribute-button"><img src="Content/Graphics/InspiritImages/ALL_Buff.png" alt="InspiritIco"></button>
								<button id="Attract" class="attribute-button"><img src="Content/Graphics/InspiritImages/Attract.png" alt="InspiritIco"></button>
								<button id="Stealth" class="attribute-button"><img src="Content/Graphics/InspiritImages/Stealth.png" alt="InspiritIco"></button>
								<button id="Recover" class="attribute-button"><img src="Content/Graphics/InspiritImages/Recover.png" alt="InspiritIco"></button>
							</div>
						</li>
						<li>
							<div class="yokai-attributes" data-type="Inspirits" style="display: flex">
								<button id="STR_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/STR_Debuff.png" alt="InspiritIco"></button>
								<button id="SPR_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPR_Debuff.png" alt="InspiritIco"></button>
								<button id="SPD_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/SPD_Debuff.png" alt="InspiritIco"></button>
								<button id="DEF_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/DEF_Debuff.png" alt="InspiritIco"></button>
								<button id="ALL_Debuff" class="attribute-button"><img src="Content/Graphics/InspiritImages/ALL_Debuff.png" alt="InspiritIco"></button>
								<button id="Loaf" class="attribute-button"><img src="Content/Graphics/InspiritImages/Loaf.png" alt="InspiritIco"></button>
								<button id="Confuse" class="attribute-button"><img src="Content/Graphics/InspiritImages/Confuse.png" alt="InspiritIco"></button>
								<button id="Scatter" class="attribute-button"><img src="Content/Graphics/InspiritImages/Scatter.png" alt="InspiritIco"></button>
								<button id="Poison" class="attribute-button"><img src="Content/Graphics/InspiritImages/Poison.png" alt="InspiritIco"></button>
							</div>
						</li>
					</ul>
				</details>
				<input type="search" id="search-input" name="query" placeholder="Search for Yokai...">
					<div id="data-page" class="yokai-list" style="overflow-y: visible;"></div>
				</div>
		</main>
	</div>
</body>
</html>
