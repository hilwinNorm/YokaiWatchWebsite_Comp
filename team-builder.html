<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki</title>
	<link rel="stylesheet" href="Content/CSS/main.css">
	<link rel="stylesheet" href="Content/CSS/info-list-style.css">
	<link rel="stylesheet" href="Content/CSS/team-builder.css">
	<script defer src="Content/JS/main.js"></script>
	<script defer src='Content/JS/Databases/YokaiDatabase.js'></script>
	<script defer src='Content/JS/Databases/SoulGemDatabase.js'></script>
	<script defer src='Content/JS/Databases/EquipmentDatabase.js'></script>
	<script defer src='Content/JS/Databases/AttitudeDatabase.js'></script>
	<script defer src='Content/JS/Databases/YokaiAbilitiesDatabase.js'></script>
	<script defer src='Content/JS/team-builder.js'></script>
</head>
<body>
	
    <nav id="nav-tab"></nav>
	
	<div id="alert-window" class="transparent-background">
		<button class="close-btn" id="alert-window__close-btn" onclick="closePopup()" class="button-menu-transfer">X</button>
		<button class="alert-window__button" onclick="saveTeam()" style="margin-top: 40px; height: auto; width: auto;">Copy</button>
		<button class="alert-window__button" onclick="loadTeam()" style="height: auto; width: auto;">Load</button>
		<button class="alert-window__button" onclick="copyAsText()" style="height: auto; width: auto;">Copy as Text</button>
		<button class="alert-window__button" onclick="copyAsImage()" style="height: auto; width: auto;">Copy as Image</button>
	</div>
	
    <div class="wrapper">        
		<aside class="side-bar" id="side_bar"></aside>
		<main>
			<div class="main-section">
				<div class="transparent-background current-rank-container">
					<img id="S_Rank1" src="Content/Graphics/S_RankUnincluded.png">
					<img id="S_Rank2" src="Content/Graphics/S_RankUnincluded.png">
					<img id="A_Rank1" src="Content/Graphics/A_RankUnincluded.png">
					<img id="A_Rank2" src="Content/Graphics/A_RankUnincluded.png">
				</div>
				<div class="wheel-section">
					<div class="wheel-section__options">
						<button onclick="activateMoveState()">Move Yo-kai</button>
						<button onclick="editTeam()">Edit team</button>
						<button onclick="showPopup()">More options</button>
						<span class="state-display" id="state-display"></span>
					</div>
					<div class="wheel-section__wheel">
						<img class="wheel-img" src="Content/Graphics/Wheel.png" alt="Wheel">
						<img id="Slot1" class="wheel-medal-img" data-index='0' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="1">
						<img id="Slot2" class="wheel-medal-img" data-index='1' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="2">
						<img id="Slot3" class="wheel-medal-img" data-index='2' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="3">
						<img id="Slot4" class="wheel-medal-img" data-index='3' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="4">
						<img id="Slot5" class="wheel-medal-img" data-index='4' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="5">
						<img id="Slot6" class="wheel-medal-img" data-index='5' onclick="selectWheelSlot(this)" src="Content/Graphics/YokaiMedals/252.webp" alt="6">
						<img id="choose-ring" src="Content/Graphics/ChosenYokai.png" alt="ChosenYokaiRing">
					</div>
				</div>
				<div class="transparent-background" id="slot-info-container">
					<div style="display: grid;">
						<div style="display: grid; align-items: center;">
							<div style="display: flex; align-items: center; gap: 10px;">
								<img id="yokai-img" width="74px" height="auto" alt="Yokai Medal">
								<h3 id="yokai-title"></h3>
							</div>
							<div style="display: flex;">
								<img id="yokai-rank" style="margin-left: 10px ;margin-right: 10px; width: 50px; height: auto;" alt="Rank">
								<img id="yokai-tribe" style="margin-left: 10px ;margin-right: 10px; width: 50px; height: auto;" alt="Tribe">
								<img id="yokai-alliance" style="margin-left: 10px ;margin-right: 10px; width: 23px; visibility: hidden;">
							</div>
						</div>
						<div style="display:grid; justify-items: center;">
							<img width="55px" height="auto" src="Content/Graphics/Equip_Image.png">
							<div style="display: flex;">
								<div id="equip-slot-1" style="position: relative; visibility: hidden;">
									<img onclick="addEquipmentIntoSlot(this)" data-index="1" src="Content/Graphics/EquipmentSlot_Image.png" style="margin-left: 5px ;margin-right: 5px" width="80px" height="auto" alt="EquipmentSlot">
									<img id="equipment-1" style="height: auto; pointer-events: none; position: absolute; top: 2px; left:7px; visibility: hidden;">
								</div>
								<div id="equip-slot-2" style="position: relative; visibility: hidden;">
									<img onclick="addEquipmentIntoSlot(this)" data-index="2" src="Content/Graphics/EquipmentSlot_Image.png" style="margin-left: 5px ;margin-right: 5px" width="80px" height="auto" alt="EquipmentSlot">
									<img id="equipment-2" style="height: auto; pointer-events: none; position: absolute; top: 2px; left:7px; visibility: hidden;">
								</div>
							</div>
						</div>
					</div>
					<div class="slot-info-container__text" style="display: flex; flex-direction: column; justify-content: space-evenly;">
						<label for="yokai-attitude">Attitude: <select id="yokai-attitude"></select></label>
						<label for="yokai-level">Level: <input id="yokai-level" type="number" placeholder="60"></label>
						<button class="slot-info-container__button" onclick="ClearEquipment()">Unequip Yo-kai</button>
					</div>
					<div class="slot-info-container__settings">
						<div class="yokai-attributes">
							<h3 id="yokai-max-hp"></h3>
							<h3 id="yokai-strength"></h3>
							<h3 id="yokai-spirit"></h3>
							<h3 id="yokai-defense"></h3>
							<h3 id="yokai-speed"></h3>
						</div>
						<div class="yokai-attributes">
							<h3>Gym STR: <input id="gym-str" type="number" placeholder="0" class="gym"></h3>
							<h3>Gym SPR: <input id="gym-spr" type="number" placeholder="0" class="gym"></h3>
							<h3>Gym DEF: <input id="gym-def" type="number" placeholder="0" class="gym"></h3>
							<h3>Gym SPD: <input id="gym-spd" type="number" placeholder="0" class="gym"></h3>
						</div>
						<div class="yokai-attributes">
							<h3>IV HP: <input id="iv-hp" type="number" placeholder="16" class="IV"></h3>
							<h3>IV STR: <input id="iv-str" type="number" placeholder="8" class="IV"></h3>
							<h3>IV SPR: <input id="iv-spr" type="number" placeholder="8" class="IV"></h3>
							<h3>IV DEF: <input id="iv-def" type="number" placeholder="8" class="IV"></h3>
							<h3>IV SPD: <input id="iv-spd" type="number" placeholder="8" class="IV"></h3>
						</div>
					</div>
				</div>
			</div>
			<div style="display: flex;">
				<div style="display: grid; align-content: center; justify-content: center; gap: 10px; width: 50%;">
					<button id="yokai-button">Yokai  <span class="icon icon-yokai"></span></button>
					<button id="equipment-button">Equipment  <span class="icon icon-equipment"></span></button>
					<button id="soulgem-button">Soul Gems  <span class="icon icon-soulgems"></span></button>
					<input type="search" id="search-input" name="query" placeholder="Search...">
				</div>
				
				
				<div class="container yokai-list transparent-background" id="data-page" style="height: 230px; width:86%; margin:0px; flex-wrap: nowrap; list-style: none; margin-right:40px; margin-top: 10px; overflow-y: scroll; overflow-x: hidden; overflow-y: visible;">
				</div>
			</div>
		</main>
	</div>
</body>
</html>
