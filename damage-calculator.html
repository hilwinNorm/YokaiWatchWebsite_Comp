<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damage Calculator</title>
    <link rel="stylesheet" href="Content/CSS/main.css"/>
    <link rel="stylesheet" href="Content/CSS/info-list-style.css"/>
    <link rel="stylesheet" href="Content/CSS/damage-calculator.css"/>
    <script defer src="Content/JS/main.js"></script>
	<script defer src='Content/JS/Databases/AttackDatabase.js'></script>
    <script defer src='Content/JS/Databases/TechniqueDatabase.js'></script>
	<script defer src='Content/JS/Databases/SoultimateDatabase.js'></script>
    <script defer src="Content/JS/Databases/AttitudeDatabase.js"></script>
	<script defer src="Content/JS/Databases/skill_config_0.03p/SKILL_CONFIG_INFO.js"></script>
	<script defer src="Content/JS/Databases/skill_config_0.03p/SKILL_GROWTH_INFO.js"></script>
	<script defer src="Content/JS/Databases/skill_config_0.03p/SPSKILL_POINT_INFO.js"></script>
	<script defer src="Content/JS/Databases/SteffInfoDatabase.js"></script>
	<script defer src="Content/JS/Databases/YokaiDatabase.js"></script>
    <script defer src="Content/JS/damage-calculator.js"></script>
</head>
<body>
    <nav id="nav-tab"></nav>
    <div class="wrapper">
        <aside class="side-bar" id="side_bar"></aside>

        <main class="damage-calculator">
			<div class="yokai-info transparent-background">
				<div class="combatants">
					<fieldset class="combatant-panel" id="defender-container">
						<legend id="legendDefender">Defender</legend>
						<div class="combatant-header">
							<img id="defenderImg" alt="Defender Image">
							<p id="defenderName"></p>
							<label>
								Level: 
								<input id="defender-lvl-input" type="number" placeholder="60" value="60">
							</label>
						</div>
						
						<section class="stat-group">
							<h3>HP:</h3>
							<div class="stat-grid">
								<label>
									Base:
									<input type="number" value="0" id="defender-hp">
								</label>
								<label>
									Gym:
									<input type="number" disabled id="defender-gym-hp">
								</label>
								<label>
									IV:
									<input type="number" value="0" id="defender-iv-hp">
								</label>
								<label>
									EV:
									<input type="number" value="0" id="defender-ev-hp">
								</label>
							</div>
						</section>
						<section class="stat-group">
							<h3>DEF:</h3>
							<div class="stat-grid">
								<label>
									Base:
									<input type="number" value="0" id="defender-def">
								</label>
								<label>
									Gym:
									<input type="number" value="0" id="defender-gym-def">
								</label>
								<label>
									IV:
									<input type="number" value="0" id="defender-iv-def">
								</label>
								<label>
									EV:
									<input type="number" value="0" id="defender-ev-def">
								</label>
							</div>
						</section>
						
					</fieldset>
						
					<fieldset class="combatant-panel" id="attacker-container">
						<legend id="legendAttacker">Attacker</legend>
						<div class="combatant-header">
							<img id="attackerImg" alt="Attacker Image">
							<p id="attackerName"></p>
							<label>
								Level: 
								<input id="attacker-lvl-input" type="number" placeholder="60" value="60">
							</label>
						</div>
						<section class="stat-group">
							<h3>STR:</h3>
							<div class="stat-grid">
								<label>
									Base:
									<input type="number" value="0" id="attacker-str">
								</label>
								<label>
									Gym:
									<input type="number" value="0" id="attacker-gym-str">
								</label>
								<label>
									IV:
									<input type="number" value="0" id="attacker-iv-str">
								</label>
								<label>
									EV:
									<input type="number" value="0" id="attacker-ev-str">
								</label>
							</div>
						</section>

						<section class="stat-group">
							<h3>SPR:</h3>
							<div class="stat-grid">
								<label>
									Base:
									<input type="number" value="0" id="attacker-spr">
								</label>
								<label>
									Gym:
									<input type="number" value="0" id="attacker-gym-spr">
								</label>
								<label>
									IV:
									<input type="number" value="0" id="attacker-iv-spr">
								</label>
								<label>
									EV:
									<input type="number" value="0" id="attacker-ev-spr">
								</label>
							</div>
						</section>
					</fieldset>
				</div>
			</div>
			<div class="bottom-field">
				<section class="attack-panel transparent-background">
					<label id="selectedSideDisplay"></label>
					<section class="attack-settings">
						<label>
							Attack Type
							<select id="move-type">
								<option value="AttackID">Attack</option>
								<option value="TechniqueID">Technique</option>
								<option value="SoultimateBtlCommandID">Soultimate</option>
							</select>
						</label>
						<label>
							Crit:
							<input type="checkbox" id="isCrit"/>
						</label>
						<label>
							Moxie:
							<input type="checkbox" disabled id="isMoxie"/>
						</label>
						<label>
							Defending:
							<input type="checkbox" id="isDefending"/>
						</label>
						<label>
							Crit Skill Amplifier:
							<input type="checkbox" id="isCritSkill"/>
						</label>
						<label>
							Defense Skill Amplifier:
							<input type="checkbox" id="isDefenseSkill"/>
						</label>
					</section>

					<button id="calcButton" class="main-button">
						Calculate
					</button>
					
					<div class="attack-result">
						<span>
							Result:
							<span id="DamageOutput"></span>
						</span>
						

						<span>
							Hits needed:
							<span id="HitsDiv"></span>
						</span>
					</div>	
				</section>
				<div class="container yokai-list transparent-background" id="data-page" style="overflow-y: visible;"></div>
			</div>
		</main>
	</div>
</body>
</html>
